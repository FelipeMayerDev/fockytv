[package]
name = "fockytv-share"
version = "0.1.0"
edition = "2021"
description = "Mini client nativo de compartilhamento de tela para o FockyTV (WHIP)"

[[bin]]
name = "fockytv-share"
path = "src/main.rs"

[dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net", "sync", "signal"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
pipewire = "0.10"
ashpd = { version = "0.13", features = ["tokio", "screencast", "global_shortcuts"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.21"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
