[package]
name = "fockytv-share"
version = "0.1.0"
edition = "2021"
description = "Mini client nativo de compartilhamento de tela para o FockyTV (WHIP)"

[[bin]]
name = "fockytv-share"
path = "src/main.rs"

[dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
ashpd = { version = "0.13", features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net", "sync", "signal"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
lto = "thin"
strip = true
