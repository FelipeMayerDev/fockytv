# Local (máquina do focky): o compose principal aponta o candidato ICE pro
# IP do servidor de deploy (192.168.1.129); daqui, os candidatos ICE precisam
# ser o IP desta máquina pra WebRTC conectar na LAN.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  mediamtx:
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=192.168.1.175
