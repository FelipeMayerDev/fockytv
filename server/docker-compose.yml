# Local:  docker compose up   → http://localhost:8180/
# Externo: o agente playit lê o secret de ./playit-data/playit.toml
#          (gerado uma vez com `playit claim generate/exchange`).
# Passo a passo e as armadilhas: ../README.md
services:
  broadcast-box:
    image: seaduboi/broadcast-box:latest
    container_name: fockytv
    restart: unless-stopped
    ports:
      - "8180:8080/tcp"
      - "8180:8180/udp"
    environment:
      # Lista, não mapa: aqui "\r\n" vira CRLF de verdade. Em mapa com aspas
      # duplas você precisaria escapar, e o SDP receberia os caracteres literais.
      - HTTP_ADDRESS=:8080
      - UDP_MUX_PORT=8180
      - NAT_1_TO_1_IP=192.168.1.129
      - NETWORK_TYPES=udp4|tcp4
      # ponytail: self-test morre em hairpin NAT do container; cliente real via LAN funciona
      - NETWORK_TEST_ON_START=FALSE
      # ponytail: o playit alocou 3652, não 8180 — anuncia o par público direto no SDP.
      # Contorna o gotcha da porta: NAT_1_TO_1_IP reescreve só o IP, nunca a porta.
      - "APPEND_CANDIDATE=a=candidate:playit1 1 udp 1694498815 147.185.221.213 3652 typ host\r\n"
    volumes:
      - ./fase0.html:/broadcast-box/web/build/index.html:ro

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.15
    container_name: fockytv-playit
    restart: unless-stopped
    # host net pra alcançar 8180/udp direto, sem mapping
    network_mode: host
    # o entrypoint padrão exige SECRET_KEY no ambiente; este lê do toml montado
    entrypoint: playit -s --platform_docker start
    volumes:
      - ./playit-data:/etc/playit
