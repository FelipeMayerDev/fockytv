# Local:  docker compose up   → http://localhost:8180/
# Externo: o agente playit lê o secret de ./playit-data/playit.toml
#          (gerado uma vez com `playit claim generate/exchange`).
# Passo a passo e as armadilhas: ../README.md
services:
  broadcast-box:
    # upstream + server/broadcast-box/viewer-identity.patch: /api/status
    # informa quem está assistindo (nick no POST do WHEP via ?viewer=)
    build: ./broadcast-box
    image: fockytv/broadcast-box:viewer
    container_name: fockytv
    restart: unless-stopped
    ports:
      - "8180:8080/tcp"
      - "8180:8180/udp"
    environment:
      # Lista, não mapa: aqui "\r\n" vira CRLF de verdade. Em mapa com aspas
      # duplas você precisaria escapar, e o SDP receberia os caracteres literais.
      - HTTP_ADDRESS=:8080
      - UDP_MUX_PORT=8180
      - NAT_1_TO_1_IP=192.168.1.129
      - NETWORK_TYPES=udp4|tcp4
      # /api/fixed/* (busca/playlist das lives fixas) vira proxy pro sidecar
      - FIXED_LIVE_URL=http://fixed-live:3000
      # ponytail: self-test morre em hairpin NAT do container; cliente real via LAN funciona
      - NETWORK_TEST_ON_START=FALSE
      # ponytail: o playit alocou 3652, não 8180 — anuncia o par público direto no SDP.
      # Contorna o gotcha da porta: NAT_1_TO_1_IP reescreve só o IP, nunca a porta.
      - "APPEND_CANDIDATE=a=candidate:playit1 1 udp 1694498815 147.185.221.213 3652 typ host\r\n"
    volumes:
      - ../ui/index.html:/broadcast-box/web/build/index.html:ro
      - ../ui/discord.js:/broadcast-box/web/build/discord.js:ro
      - ../ui/jam.js:/broadcast-box/web/build/jam.js:ro
      - ../ui/jam-worklet.js:/broadcast-box/web/build/jam-worklet.js:ro
      - ../ui/shim.html:/broadcast-box/web/build/shim.html:ro
      - ../ui/du-bist-gut-genug.mp3:/broadcast-box/web/build/du-bist-gut-genug.mp3:ro
      - ../ui/assets:/broadcast-box/web/build/assets:ro

  # Lives fixas (TV e música): yt-dlp + ffmpeg + werift publicando no
  # broadcast-box via WHIP nas chaves `tv` e `music`. Sem viewers por 60 s a
  # stream desliga sozinha — a playlist de música sobrevive.
  fixed-live:
    build: ./fixed-live
    image: fockytv/fixed-live:latest
    container_name: fockytv-fixed
    restart: unless-stopped
    environment:
      - BB_URL=http://broadcast-box:8080
      - IDLE_MS=60000
      # link usado nos anúncios do Discord ("fulano subiu ao ar")
      - PUBLIC_URL=http://192.168.1.129:8180
      # pra anunciar num canal do Discord: crie um webhook lá
      # (Configurações do canal → Integrações → Webhooks) e descomente:
      # - DISCORD_WEBHOOK=https://discord.com/api/webhooks/…
    # cookies do YouTube (formato Netscape) contra o "confirm you're not a
    # bot": exporte de um navegador logado pra server/cookies.txt e reinicie
    volumes:
      - ./cookies.txt:/app/cookies.txt
      # SQLite (histórico de músicas, chat): sobrevive a recriação do container
      - ./fixed-live-data:/app/data

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.15
    container_name: fockytv-playit
    restart: unless-stopped
    # host net pra alcançar 8180/udp direto, sem mapping
    network_mode: host
    # o entrypoint padrão exige SECRET_KEY no ambiente; este lê do toml montado
    entrypoint: playit -s --platform_docker start
    volumes:
      - ./playit-data:/etc/playit
