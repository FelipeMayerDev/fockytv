# Local:  docker compose up   → http://localhost:8180/
# VPS:    este arquivo tem alteração local lá (IP público direto em vez de
#         playit) — ver AGENTS.md antes de sobrescrever.
#
# Arquitetura: mediamtx é o motor de mídia (WHIP/WHEP/ICE); o live-api é a
# única porta HTTP (sinalização, /api/status, /api/fixed/*, estáticos da ui/).
# Portas públicas: 8180/tcp → live-api (HTTP) e 8180/udp → mediamtx (mídia),
# exatamente como era com o broadcast-box.
#
# Os IPs de candidato ICE vêm de env com default da LAN:
#   MTX_ADDITIONAL_HOSTS=192.3.176.195  (VPS)
#   MTX_ADDITIONAL_HOSTS=127.0.0.1      (teste local)
#
# O playit saiu: sem ele, acesso externo à LAN não existe (o candidato
# público do túnel era injetado no SDP pelo APPEND_CANDIDATE do
# broadcast-box, que o mediamtx não tem). Pra acesso externo use a VPS.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: fockytv-mtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    environment:
      # IP que os clientes ICE alcançam (vira candidato no SDP junto com os
      # IPs das interfaces — o 172.x da rede docker é o que o gravador do
      # fixed-live usa, sem hairpin)
      - MTX_WEBRTCADDITIONALHOSTS=${MTX_ADDITIONAL_HOSTS:-192.168.1.129}
    ports:
      - "8180:8180/udp"
      # 8889 (WHIP/WHEP), 9997 (api) e 9998 (metrics) ficam internos: só o
      # live-api fala com eles

  live-api:
    build: ./live-api
    image: fockytv/live-api:latest
    container_name: fockytv-api
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "8180:8080/tcp"
    environment:
      - MTX_WEBRTC=http://mediamtx:8889
      - MTX_API=http://mediamtx:9997
      - MTX_USER=liveapi
      - MTX_PASS=fockytv-internal
      - FIXED_LIVE_URL=http://fixed-live:3000
      - STATIC_DIR=/srv/ui
      - DOWNLOAD_DIR=/srv/download
    volumes:
      # diretório inteiro (não arquivo único): trocar asset não exige restart
      - ../ui:/srv/ui:ro
      # instalador do app (dist/ não entra no git: o .exe chega por scp).
      # Sem a pasta, o mount cria vazia e o /download só devolve 404.
      - ../dist/win:/srv/download:ro

  # Lives fixas (TV e música): yt-dlp + ffmpeg + werift publicando via WHIP
  # nas chaves `tv` e `music`. Sem viewers por 60 s a stream desliga sozinha
  # — a playlist de música sobrevive.
  fixed-live:
    build: ./fixed-live
    image: fockytv/fixed-live:latest
    container_name: fockytv-fixed
    restart: unless-stopped
    environment:
      - BB_URL=http://live-api:8080
      - IDLE_MS=60000
      # link usado nos anúncios do Discord ("fulano subiu ao ar")
      - PUBLIC_URL=${PUBLIC_URL:-http://192.168.1.129:8180}
      # gravador: IP que o mediamtx anuncia nos candidatos (webrtcAdditionalHosts);
      # da rede docker trocamos pelo hostname, o hairpin UDP nem sempre volta
      - BB_PUBLIC_IP=${BB_PUBLIC_IP:-192.168.1.129}
      - BB_CANDIDATE_HOST=mediamtx
      # pra anunciar num canal do Discord: crie um webhook lá
      # (Configurações do canal → Integrações → Webhooks) e descomente:
      # - DISCORD_WEBHOOK=https://discord.com/api/webhooks/…
    # cookies do YouTube (formato Netscape) contra o "confirm you're not a
    # bot": exporte de um navegador logado pra server/cookies.txt e reinicie
    volumes:
      - ./cookies.txt:/app/cookies.txt
      # SQLite (histórico de músicas, chat): sobrevive a recriação do container
      - ./fixed-live-data:/app/data
