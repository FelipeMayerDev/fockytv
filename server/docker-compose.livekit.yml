# Usar junto do compose existente; preserva os overrides locais da VPS.
services:
  livekit-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --save, "60", "1"]
    volumes:
      - livekit-redis:/data
  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    depends_on:
      - livekit-redis
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        redis:
          address: livekit-redis:6379
        ingress:
          whip_base_url: http://livekit-ingress:8080/whip
        rtc:
          node_ip: ${LIVEKIT_NODE_IP:?Defina LIVEKIT_NODE_IP}
          use_external_ip: false
          tcp_port: 7881
          udp_port: 7882
        keys:
          ${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET}
  livekit-ingress:
    image: livekit/ingress:v1.5.0
    restart: unless-stopped
    depends_on:
      - livekit
    ports:
      - "7885:7885/udp"
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
        rtmp_port: -1
        whip_port: 8080
        rtc_config:
          node_ip: ${LIVEKIT_NODE_IP:?Defina LIVEKIT_NODE_IP}
          udp_port: 7885
          use_external_ip: false
  live-api:
    depends_on:
      - livekit
      - livekit-ingress
    environment:
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_INGRESS_URL=http://livekit-ingress:8080
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET}
volumes:
  livekit-redis:
